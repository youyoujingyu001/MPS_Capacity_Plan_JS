name: Build macOS App (Apple Silicon + Intel)

# 触发方式:
#   1) push 到 main        -> 构建并上传 Artifact
#   2) 打 tag (v*)         -> 构建并上传 Artifact (可在 Actions 页下载)
#   3) 手动触发            -> Actions 页 "Run workflow" 按钮
#
# 产物: Actions 运行页底部 Artifacts 区 (zip, 保留 90 天):
#   - MPS-Capacity-macOS-arm64  : Apple Silicon (M1/M2/M3/M4)
#   - MPS-Capacity-macOS-x86_64 : Intel 芯片 (如 MacBook Air 2017)
#
# 下载后使用步骤 (给 Mac 用户):
#   1. 解压得到 MPS-Capacity.app
#   2. 首次运行前 在终端执行:  xattr -cr /path/to/MPS-Capacity.app
#   3. 双击打开; 若提示"无法验证开发者", 右键 -> 打开 -> 打开
#   4. App 内: 选数据源 -> 选源文件夹 -> 自动匹配文件 -> 运行

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mac:
    strategy:
      fail-fast: false   # 一个架构失败不影响另一个
      matrix:
        include:
          # Apple Silicon: macos-14 运行器是 arm64
          - os: macos-14
            arch: arm64
          # Intel: macos-15-intel 运行器是 x86_64 (macos-13 已退役)
          - os: macos-15-intel
            arch: x86_64

    runs-on: ${{ matrix.os }}

    env:
      TARGET_ARCH: ${{ matrix.arch }}
      # 最低兼容 macOS 12 (Monterey), 覆盖 Intel 老机型
      MACOSX_DEPLOYMENT_TARGET: '12.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show runner architecture
        run: |
          echo "runner: ${{ matrix.os }} / target: ${{ matrix.arch }}"
          echo "runner arch: $(uname -m)"
          python -c "import platform; print('python machine:', platform.machine(), 'version:', platform.python_version())"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-mac.txt pyinstaller

      - name: Build .app with PyInstaller
        run: pyinstaller MPS-Capacity.app.spec --noconfirm

      - name: Verify bundle architecture
        run: |
          file dist/MPS-Capacity.app/Contents/MacOS/MPS-Capacity
          lipo -archs dist/MPS-Capacity.app/Contents/MacOS/MPS-Capacity
          lipo -archs dist/MPS-Capacity.app/Contents/MacOS/MPS-Capacity | grep -q '${{ matrix.arch }}'

      - name: Ad-hoc codesign (绕过 Gatekeeper)
        run: codesign --force --sign - dist/MPS-Capacity.app && codesign --verify --deep --verbose=2 dist/MPS-Capacity.app

      - name: Smoke test core script (导入 + 版本)
        run: python MPS-Capacity_V2.0.py 2>&1 | head -5 || true

      - name: Zip the .app (保留符号链接)
        run: zip -qry MPS-Capacity-macOS-${{ matrix.arch }}.zip dist/MPS-Capacity.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MPS-Capacity-macOS-${{ matrix.arch }}
          path: MPS-Capacity-macOS-${{ matrix.arch }}.zip
          retention-days: 90
          if-no-files-found: error
