name: Build macOS ARM64 App

# 触发方式:
#   1) push 到 main        -> 构建并上传 Artifact
#   2) 打 tag (v*)         -> 构建并上传 Artifact (可在 Actions 页下载)
#   3) 手动触发            -> Actions 页 "Run workflow" 按钮
#
# 产物: Actions 运行页底部 Artifacts 区的 MPS-Capacity-macOS-arm64 (zip, 保留 90 天)
#
# 下载后使用步骤 (给 Mac 用户):
#   1. 解压得到 MPS-Capacity.app
#   2. 首次运行前 在终端执行:  xattr -cr /path/to/MPS-Capacity.app
#   3. 双击打开; 若提示"无法验证开发者", 右键 -> 打开 -> 打开
#   4. App 内: 选数据源 -> 选源文件夹 -> 自动匹配文件 -> 运行

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mac:
    # macos-14 运行器 = Apple Silicon (arm64); 不用 macos-latest 以避免落到 Intel/其他镜像
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show runner architecture
        run: |
          echo "runner arch: $(uname -m)"
          python -c "import platform; print('python machine:', platform.machine(), 'version:', platform.python_version())"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-mac.txt pyinstaller

      - name: Build .app with PyInstaller
        run: pyinstaller MPS-Capacity.app.spec --noconfirm

      - name: Verify bundle architecture (must be arm64)
        run: |
          file dist/MPS-Capacity.app/Contents/MacOS/MPS-Capacity
          lipo -archs dist/MPS-Capacity.app/Contents/MacOS/MPS-Capacity || true

      - name: Ad-hoc codesign (绕过 Gatekeeper)
        run: codesign --force --sign - dist/MPS-Capacity.app && codesign --verify --deep --verbose=2 dist/MPS-Capacity.app

      - name: Smoke test core script (导入 + 版本)
        run: python MPS-Capacity_V2.0.py 2>&1 | head -5 || true

      - name: Zip the .app (保留符号链接)
        run: zip -qry MPS-Capacity-macOS-arm64.zip dist/MPS-Capacity.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MPS-Capacity-macOS-arm64
          path: MPS-Capacity-macOS-arm64.zip
          retention-days: 90
          if-no-files-found: error
